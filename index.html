<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>社内ポータル</title>
    <link rel="stylesheet" href="/app01/static/css/style.css" />
  </head>
  <body>
    <header>
      <h1>社内ポータル</h1>
      <span id="user"></span>
    </header>
    <nav>
      <button data-tab="home" class="active">ホーム</button>
      <button data-tab="announce">お知らせ</button>
      <button data-tab="admin" id="adminTabBtn" style="display: none">
        管理
      </button>
    </nav>
    <main>
      <section id="home" class="tab active">
        <h2>ホーム</h2>
        <p>
          動画・マニュアルを閲覧できます。コンテンツは閲覧時にSAS
          URLを取得してBlobから直接表示します。
        </p>
      </section>

      <section id="announce" class="tab">
        <h2>お知らせ</h2>
        <div class="subtabs" id="noteTabs">
          <button data-cat="release" class="active">リリース</button>
          <button data-cat="update">アップデート</button>
          <button data-cat="news">ニュース</button>
        </div>
        <div id="releaseNotes" aria-live="polite">読み込み中...</div>
      </section>

      <section id="admin" class="tab">
        <h2>管理</h2>
        <div class="sidebar">
          <div class="folders" id="folders"></div>
          <div class="files">
            <div class="notice" id="announceNotice" style="display: none">
              このフォルダ（お知らせ）を更新するとメール通知が送信されます。
            </div>
            <div class="toolbar">
              <input type="search" id="search" placeholder="検索" />
              <button class="act" id="filePick">ファイル選択</button>
              <button class="act danger" id="selDelete">選択削除</button>
              <span class="count" id="fileCount"></span>
              <input type="file" id="fileInput" multiple hidden />
            </div>
            <div class="dropzone" id="dropzone" role="button" tabindex="0">
              ファイルをここにドラッグ＆ドロップ、またはクリックして選択
            </div>
            <div id="uploads"></div>
            <table>
              <thead>
                <tr>
                  <th></th>
                  <th>アプリ名</th>
                  <th data-sort="name">
                    ファイル名<span class="arrow"></span>
                  </th>
                  <th data-sort="size">サイズ<span class="arrow"></span></th>
                  <th data-sort="last_modified">
                    更新日時<span class="arrow"></span>
                  </th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="fileBody"></tbody>
            </table>
            <div class="empty" id="emptyState" style="display: none">
              ファイルがありません
            </div>
            <div class="pager" id="pager" style="display: none">
              <button class="act" id="prevPage">前へ</button>
              <span id="pageInfo"></span>
              <button class="act" id="nextPage">次へ</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="toasts"></div>
    <script type="module" src="/app01/static/js/app.js"></script>
  </body>
</html>
