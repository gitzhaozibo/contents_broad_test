<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>社内ポータル</title>
<style>
  :root { --bg:#f4f6f8; --accent:#0b5cab; --border:#d6dbe1; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI", "Hiragino Sans", Meiryo, sans-serif; background:var(--bg); color:#1f2933; }
  header { background:var(--accent); color:#fff; padding:12px 20px; }
  header h1 { font-size:18px; margin:0; }
  nav { display:flex; gap:4px; background:#fff; border-bottom:1px solid var(--border); padding:0 12px; }
  nav button { border:none; background:none; padding:14px 18px; font-size:14px; cursor:pointer; border-bottom:3px solid transparent; }
  nav button.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  main { padding:20px; max-width:1100px; margin:0 auto; }
  .tab { display:none; }
  .tab.active { display:block; }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th, td { padding:8px 12px; border-bottom:1px solid var(--border); text-align:left; font-size:14px; }
  th { background:#eef2f6; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; align-items:center; }
  input[type=search] { padding:6px 10px; border:1px solid var(--border); border-radius:4px; }
  .dropzone { border:2px dashed var(--accent); border-radius:6px; padding:24px; text-align:center; color:#54616e; background:#fff; margin-bottom:12px; }
  .notice { background:#fff7e6; border:1px solid #f0c36d; padding:10px 12px; border-radius:4px; margin-bottom:12px; }
  .sidebar { display:flex; gap:16px; }
  .folders { width:200px; }
  .folders button { display:block; width:100%; text-align:left; padding:8px; border:1px solid var(--border); background:#fff; margin-bottom:4px; cursor:pointer; border-radius:4px; }
  .folders button.active { background:var(--accent); color:#fff; }
  .files { flex:1; }
  button.act { padding:4px 8px; font-size:12px; cursor:pointer; }
  .release-note { background:#fff; border:1px solid var(--border); border-radius:6px; padding:16px; margin-bottom:12px; border-left:4px solid var(--accent); }
  .release-note h3 { margin:0 0 4px; font-size:16px; }
  .release-note time { color:#54616e; font-size:12px; }
  .release-note pre { margin:12px 0 0; white-space:pre-wrap; font:inherit; line-height:1.6; }
  .subtabs { display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--border); }
  .subtabs button { border:none; background:none; padding:10px 16px; font-size:14px; cursor:pointer; border-bottom:3px solid transparent; }
  .subtabs button.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  .note-badge { display:inline-block; font-size:11px; font-weight:600; color:#fff; border-radius:10px; padding:2px 10px; margin-bottom:8px; }
  .release-note .note-badge { background:var(--accent); }
  .update-note { background:#fff; border:1px solid var(--border); border-left:4px solid #1e7e34; border-radius:6px; padding:12px 16px; margin-bottom:8px; }
  .update-note .note-badge { background:#1e7e34; }
  .update-note h3 { margin:0; font-size:14px; display:inline; }
  .update-note time { color:#54616e; font-size:12px; margin-left:8px; }
  .update-note p { margin:6px 0 0; font-size:13px; color:#3e4c59; white-space:pre-wrap; line-height:1.5; }
  .news-note { background:#fffdf5; border:1px solid #e8dcc0; border-left:4px solid #d68910; border-radius:6px; padding:16px 20px; margin-bottom:12px; }
  .news-note .note-badge { background:#d68910; }
  .news-note time { display:block; color:#8a6d1a; font-size:12px; margin-bottom:4px; }
  .news-note h3 { margin:0 0 8px; font-size:18px; line-height:1.4; }
  .news-note p { margin:0; white-space:pre-wrap; line-height:1.7; color:#3e4c59; }
  th[data-sort] { cursor:pointer; user-select:none; }
  th .arrow { margin-left:4px; font-size:10px; color:var(--accent); }
  td a { color:var(--accent); text-decoration:none; }
  td a:hover { text-decoration:underline; }
  button.act.danger { background:#c0392b; color:#fff; border:1px solid #a93226; border-radius:4px; }
  .count { color:#54616e; font-size:13px; margin-left:auto; }
  .empty { background:#fff; border:1px solid var(--border); border-top:none; padding:24px; text-align:center; color:#54616e; font-size:14px; }
  .pager { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:12px; }
  .dropzone { cursor:pointer; }
  .dropzone:focus { outline:2px solid var(--accent); outline-offset:2px; }
  #uploads .progress { background:#fff; border:1px solid var(--border); border-radius:4px; padding:8px 12px; margin-bottom:8px; font-size:13px; }
  #uploads .track { height:6px; background:#e3e8ee; border-radius:3px; margin-top:6px; overflow:hidden; }
  #uploads .fill { height:100%; width:0; background:var(--accent); transition:width .2s; }
  #toasts { position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:1000; }
  .toast { background:#1f2933; color:#fff; padding:10px 14px; border-radius:6px; font-size:14px; display:flex; gap:12px; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  .toast.success { background:#1e7e34; }
  .toast.error { background:#c0392b; }
  .toast button { background:none; border:none; color:#ffd54d; cursor:pointer; font-weight:600; }
</style>
</head>
<body>
<header><h1>社内ポータル</h1><span id="user"></span></header>
<nav>
  <button data-tab="home" class="active">ホーム</button>
  <button data-tab="announce">お知らせ</button>
  <button data-tab="admin" id="adminTabBtn" style="display:none">管理</button>
</nav>
<main>
  <section id="home" class="tab active">
    <h2>ホーム</h2>
    <p>動画・マニュアルを閲覧できます。コンテンツは閲覧時にSAS URLを取得してBlobから直接表示します。</p>
  </section>

  <section id="announce" class="tab">
    <h2>お知らせ</h2>
    <div class="subtabs" id="noteTabs">
      <button data-cat="release" class="active">リリース</button>
      <button data-cat="update">アップデート</button>
      <button data-cat="news">ニュース</button>
    </div>
    <div id="releaseNotes" aria-live="polite">読み込み中...</div>
  </section>

  <section id="admin" class="tab">
    <h2>管理</h2>
    <div class="sidebar">
      <div class="folders" id="folders"></div>
      <div class="files">
        <div class="notice" id="announceNotice" style="display:none">このフォルダ（お知らせ）を更新するとメール通知が送信されます。</div>
        <div class="toolbar">
          <input type="search" id="search" placeholder="検索" />
          <button class="act" id="filePick">ファイル選択</button>
          <button class="act danger" id="selDelete">選択削除</button>
          <span class="count" id="fileCount"></span>
          <input type="file" id="fileInput" multiple hidden />
        </div>
        <div class="dropzone" id="dropzone" role="button" tabindex="0">ファイルをここにドラッグ＆ドロップ、またはクリックして選択</div>
        <div id="uploads"></div>
        <table>
          <thead><tr><th></th><th data-sort="name">名前<span class="arrow"></span></th><th data-sort="size">サイズ<span class="arrow"></span></th><th data-sort="last_modified">更新日時<span class="arrow"></span></th><th>操作</th></tr></thead>
          <tbody id="fileBody"></tbody>
        </table>
        <div class="empty" id="emptyState" style="display:none">ファイルがありません</div>
        <div class="pager" id="pager" style="display:none">
          <button class="act" id="prevPage">前へ</button>
          <span id="pageInfo"></span>
          <button class="act" id="nextPage">次へ</button>
        </div>
      </div>
    </div>
  </section>
</main>
<div id="toasts"></div>
<script>
const BASE = "/app01";
const FOLDERS = ["manuals/", "videos/", "release_notes/", "announcements/"];
const PAGE_SIZE = 50;
const DELETE_UNDO_MS = 5000;
let currentPrefix = "manuals/";
let allFiles = [];
let sortKey = "last_modified", sortDir = -1;
let currentPage = 1;
const pendingDeletes = new Map();

function api(path, opts) { return fetch(BASE + "/api" + path, opts); }

function fmtSize(bytes) {
  if (bytes == null || bytes === "") return "";
  if (bytes < 1024) return bytes + " B";
  const units = ["KB", "MB", "GB", "TB"];
  let v = bytes;
  for (let i = 0; i < units.length; i++) {
    v /= 1024;
    if (v < 1024 || i === units.length - 1) return v.toFixed(1) + " " + units[i];
  }
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function baseName(name) { return name.startsWith(currentPrefix) ? name.slice(currentPrefix.length) : name; }

function contentUrl(name) { return BASE + "/content/" + name.split("/").map(encodeURIComponent).join("/"); }

function toast(msg, type = "info", actionLabel, onAction, duration = 4000) {
  const box = document.createElement("div");
  box.className = "toast " + type;
  const span = document.createElement("span"); span.textContent = msg;
  box.appendChild(span);
  if (actionLabel) {
    const btn = document.createElement("button");
    btn.textContent = actionLabel;
    btn.onclick = () => { onAction(); box.remove(); };
    box.appendChild(btn);
  }
  document.getElementById("toasts").appendChild(box);
  setTimeout(() => box.remove(), duration);
}

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  document.getElementById(b.dataset.tab).classList.add("active");
  if (b.dataset.tab === "admin") loadFiles();
  if (b.dataset.tab === "announce") loadReleaseNotes();
}));

async function init() {
  try {
    const r = await api("/me");
    const me = await r.json();
    document.getElementById("user").textContent = me.name ? "  " + me.name : "";
    if (me.is_admin) document.getElementById("adminTabBtn").style.display = "";
  } catch (e) {}
  const fc = document.getElementById("folders");
  FOLDERS.forEach(f => {
    const btn = document.createElement("button");
    btn.textContent = f; if (f === currentPrefix) btn.classList.add("active");
    btn.onclick = () => { currentPrefix = f; document.querySelectorAll(".folders button").forEach(x=>x.classList.remove("active")); btn.classList.add("active"); loadFiles(); };
    fc.appendChild(btn);
  });
}

async function loadFiles() {
  document.getElementById("announceNotice").style.display = currentPrefix === "announcements/" ? "block" : "none";
  const r = await api("/admin/files?prefix=" + encodeURIComponent(currentPrefix));
  if (!r.ok) return;
  allFiles = (await r.json()).files || [];
  currentPage = 1;
  render();
}

const NOTE_CATEGORIES = { release: "リリース", update: "アップデート", news: "ニュース" };
let allNotes = [];
let currentCategory = "release";

document.querySelectorAll("#noteTabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#noteTabs button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  currentCategory = b.dataset.cat;
  renderNotes();
}));

function noteTitle(note) {
  return note.name.split("/").pop()
    .replace(/\.txt$/i, "")
    .replace(/^(update_|news_)/i, "");
}

function noteBadge(category) {
  const badge = document.createElement("span");
  badge.className = "note-badge";
  badge.textContent = NOTE_CATEGORIES[category];
  return badge;
}

function renderReleaseNote(note) {
  const article = document.createElement("article");
  article.className = "release-note";
  const title = document.createElement("h3");
  title.textContent = noteTitle(note);
  const time = document.createElement("time");
  time.dateTime = note.last_modified || "";
  time.textContent = fmtDate(note.last_modified);
  const content = document.createElement("pre");
  content.textContent = note.content;
  article.append(noteBadge("release"), title, time, content);
  return article;
}

function renderUpdateNote(note) {
  const article = document.createElement("article");
  article.className = "update-note";
  const head = document.createElement("div");
  const title = document.createElement("h3");
  title.textContent = noteTitle(note);
  const time = document.createElement("time");
  time.dateTime = note.last_modified || "";
  time.textContent = fmtDate(note.last_modified);
  head.append(noteBadge("update"), document.createTextNode(" "), title, time);
  const content = document.createElement("p");
  content.textContent = note.content;
  article.append(head, content);
  return article;
}

function renderNewsNote(note) {
  const article = document.createElement("article");
  article.className = "news-note";
  const time = document.createElement("time");
  time.dateTime = note.last_modified || "";
  time.textContent = fmtDate(note.last_modified);
  const title = document.createElement("h3");
  const lines = (note.content || "").split("\n");
  title.textContent = lines[0] || noteTitle(note);
  const content = document.createElement("p");
  content.textContent = lines.slice(1).join("\n").trim();
  article.append(noteBadge("news"), time, title, content);
  return article;
}

const NOTE_RENDERERS = { release: renderReleaseNote, update: renderUpdateNote, news: renderNewsNote };

function renderNotes() {
  const container = document.getElementById("releaseNotes");
  container.innerHTML = "";
  const notes = allNotes.filter(n => (n.category || "release") === currentCategory);
  if (!notes.length) {
    container.textContent = "現在、" + NOTE_CATEGORIES[currentCategory] + "のお知らせはありません。";
    return;
  }
  notes.forEach(note => container.appendChild(NOTE_RENDERERS[currentCategory](note)));
}

async function loadReleaseNotes() {
  const container = document.getElementById("releaseNotes");
  container.textContent = "読み込み中...";
  try {
    const r = await api("/release-notes");
    if (!r.ok) throw new Error("request failed");
    allNotes = (await r.json()).release_notes || [];
    renderNotes();
  } catch (e) {
    container.textContent = "お知らせを読み込めませんでした。";
  }
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const files = allFiles
    .filter(f => !pendingDeletes.has(f.name))
    .filter(f => f.name.toLowerCase().includes(q))
    .sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (sortKey === "name") { va = (va || "").toLowerCase(); vb = (vb || "").toLowerCase(); }
      if (va == null) return 1;
      if (vb == null) return -1;
      return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir;
    });

  const pages = Math.max(1, Math.ceil(files.length / PAGE_SIZE));
  if (currentPage > pages) currentPage = pages;
  const pageFiles = files.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  const body = document.getElementById("fileBody"); body.innerHTML = "";
  pageFiles.forEach(f => {
    const tr = document.createElement("tr");
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.value = f.name;
    const tdCb = document.createElement("td"); tdCb.appendChild(cb);
    const tdName = document.createElement("td");
    const link = document.createElement("a");
    link.href = contentUrl(f.name); link.target = "_blank"; link.rel = "noopener";
    link.textContent = baseName(f.name); link.title = f.name;
    tdName.appendChild(link);
    const tdSize = document.createElement("td"); tdSize.textContent = fmtSize(f.size);
    const tdMod = document.createElement("td"); tdMod.textContent = fmtDate(f.last_modified);
    const btn = document.createElement("button"); btn.className = "act danger"; btn.textContent = "削除"; btn.onclick = () => scheduleDelete([f.name]);
    const tdAct = document.createElement("td"); tdAct.appendChild(btn);
    tr.append(tdCb, tdName, tdSize, tdMod, tdAct);
    body.appendChild(tr);
  });

  document.getElementById("emptyState").style.display = files.length ? "none" : "block";
  document.getElementById("fileCount").textContent = files.length ? files.length + " 件" : "";

  const pager = document.getElementById("pager");
  pager.style.display = pages > 1 ? "flex" : "none";
  document.getElementById("pageInfo").textContent = currentPage + " / " + pages;
  document.getElementById("prevPage").disabled = currentPage <= 1;
  document.getElementById("nextPage").disabled = currentPage >= pages;

  document.querySelectorAll("th[data-sort]").forEach(th => {
    th.querySelector(".arrow").textContent = th.dataset.sort === sortKey ? (sortDir === 1 ? "▲" : "▼") : "";
  });
}
document.getElementById("search").oninput = () => { currentPage = 1; render(); };
document.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
  if (sortKey === th.dataset.sort) sortDir = -sortDir;
  else { sortKey = th.dataset.sort; sortDir = th.dataset.sort === "name" ? 1 : -1; }
  render();
});
document.getElementById("prevPage").onclick = () => { currentPage--; render(); };
document.getElementById("nextPage").onclick = () => { currentPage++; render(); };

function scheduleDelete(names) {
  if (!names.length) return;
  names.forEach(n => {
    const timer = setTimeout(async () => {
      pendingDeletes.delete(n);
      const r = await api("/admin/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: n }) });
      if (!r.ok) { toast("削除に失敗しました: " + baseName(n), "error"); loadFiles(); }
    }, DELETE_UNDO_MS);
    pendingDeletes.set(n, timer);
  });
  render();
  toast(names.length + " 件を削除しました", "success", "元に戻す", () => {
    names.forEach(n => { clearTimeout(pendingDeletes.get(n)); pendingDeletes.delete(n); });
    render();
  }, DELETE_UNDO_MS);
}
document.getElementById("selDelete").onclick = () => {
  const names = [...document.querySelectorAll("#fileBody input:checked")].map(c => c.value);
  scheduleDelete(names);
};

function createProgress(name) {
  const wrap = document.createElement("div"); wrap.className = "progress";
  const label = document.createElement("span"); label.textContent = name;
  const track = document.createElement("div"); track.className = "track";
  const fill = document.createElement("div"); fill.className = "fill";
  track.appendChild(fill); wrap.append(label, track);
  document.getElementById("uploads").appendChild(wrap);
  return { set: r => { fill.style.width = Math.round(r * 100) + "%"; }, remove: () => wrap.remove() };
}

function uploadOne(name, file) {
  const bar = createProgress(name);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", BASE + "/api/admin/upload?name=" + encodeURIComponent(name));
  xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
  xhr.upload.onprogress = e => { if (e.lengthComputable) bar.set(e.loaded / e.total); };
  xhr.onload = () => {
    bar.remove();
    if (xhr.status >= 200 && xhr.status < 300) { toast("アップロード完了: " + file.name, "success"); loadFiles(); }
    else toast("アップロードに失敗しました: " + file.name, "error");
  };
  xhr.onerror = () => { bar.remove(); toast("アップロードに失敗しました: " + file.name, "error"); };
  xhr.send(file);
}

function uploadFiles(fileList) {
  const existing = new Set(allFiles.map(f => f.name));
  for (const file of fileList) {
    const name = currentPrefix + file.name;
    if (existing.has(name) && !confirm("同名ファイルが存在します。上書きしますか: " + name)) continue;
    uploadOne(name, file);
  }
}

const dz = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
dz.ondragover = e => { e.preventDefault(); };
dz.ondrop = e => { e.preventDefault(); uploadFiles(e.dataTransfer.files); };
dz.onclick = () => fileInput.click();
dz.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } };
document.getElementById("filePick").onclick = () => fileInput.click();
fileInput.onchange = () => { uploadFiles(fileInput.files); fileInput.value = ""; };

init();
</script>
</body>
</html>
