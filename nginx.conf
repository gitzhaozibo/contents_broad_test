user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    # Allow large uploads to pass through if ever routed via API (uploads go direct to Blob)
    client_max_body_size 50m;

    # Single server block. The Debian default site is removed in the image so
    # there is no conflicting server_name "_".
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Static portal served under /app01/
        location /app01/ {
            alias /var/www/html/;
            index index.html;
            try_files $uri $uri/ /var/www/html/index.html;
        }

        # API: strip /app01/ and forward to internal FastAPI on 127.0.0.1:8000
        location /app01/api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # X-MS-CLIENT-PRINCIPAL (hyphenated) passes through proxy unchanged
            proxy_read_timeout 120s;
        }
    }
}
